
name: COMCESA Fase 2 - CI

on:
  push:
    branches:
      - DEV
      - 'feature/**'

  pull_request:
    branches:
      - DEV
      - QA
      - PROD

jobs:
  build:
    name: Build y validacion
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis JavaScript
        run: |
          find src scripts tests -type f -name "*.js" -exec node --check {} \;

      - name: Ejecutar pruebas unitarias
        env:
          SESSION_SECRET: "clave-ficticia-exclusiva-para-pruebas-unitarias-2026"
          POSTGRES_PASSWORD: "password-ficticio-para-pruebas"
        run: node --test tests/backend/unit/*.test.js tests/frontend/*.test.js
