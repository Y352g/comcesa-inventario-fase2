
name: COMCESA Fase 2 - CI

on:
  push:
    branches:
      - DEV
      - QA
      - PROD
      - 'feature/**'

  pull_request:
    branches:
      - DEV
      - QA
      - PROD

jobs:
  build-and-test:
    name: Validacion, pruebas y cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: comcesa
          POSTGRES_USER: comcesa
          POSTGRES_PASSWORD: test-postgres-password-1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comcesa -d comcesa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-000000000000000000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: comcesa
      POSTGRES_USER: comcesa
      POSTGRES_PASSWORD: test-postgres-password-1234
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis JavaScript
        run: |
          find src scripts tests -type f -name "*.js" -exec node --check {} \;

      - name: Ejecutar pruebas unitarias y medir cobertura
        run: |
          npx --yes c8 --reporter=text --reporter=lcov \
            --include='src/**/*.js' \
            node --test \
            tests/backend/unit/*.test.js \
            tests/frontend/*.test.js
          test -s coverage/lcov.info

      - name: Ejecutar pruebas de integracion
        run: npm run test:integration

      - name: Analizar codigo con SonarQube Cloud
        if: ${{ github.event_name == 'push' }}
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=y352g
            -Dsonar.projectKey=Y352g_comcesa-inventario-fase2
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Construir imagen Docker
        run: docker build -f docker/backend/Dockerfile -t comcesa-inventario:${{ github.sha }} .
       
      - name: Instalar Newman
        run: npm install --no-save newman@6.2.3

      - name: Ejecutar pruebas API con Newman
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/PROD' }}
        env:
          COMCESA_API_EMAIL: ${{ secrets.COMCESA_API_EMAIL }}
          COMCESA_API_PASSWORD: ${{ secrets.COMCESA_API_PASSWORD }}
          COMCESA_BASE_URL: https://comcesa-inventario.onrender.com
        shell: bash
        run: |
          newman run postman/COMCESA_Postman_Newman_sin_credenciales.json \
            --env-var "baseUrl=$COMCESA_BASE_URL" \
            --env-var "apiEmail=$COMCESA_API_EMAIL" \
            --env-var "apiPassword=$COMCESA_API_PASSWORD"

